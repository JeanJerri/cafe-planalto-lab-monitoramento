modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions:
        - "HTTP/1.1"
        - "HTTP/2.0"
      valid_status_codes:
        - 200
      method: GET
      preferred_ip_protocol: "ip4"
      follow_redirects: true

  dns_cafeplanalto:
    prober: dns
    timeout: 5s
    dns:
      query_name: "loja.cafeplanalto.lab"
      query_type: "A"
      preferred_ip_protocol: "ip4"
      valid_rcodes:
        - NOERROR

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"
