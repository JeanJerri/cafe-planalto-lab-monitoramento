global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api:8000"

  - job_name: "nginx_exporter"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  - job_name: "postgres_exporter"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "blackbox_exporter"
    static_configs:
      - targets:
          - "sonda:9115"

  - job_name: "blackbox_http"
    metrics_path: "/probe"
    params:
      module:
        - "http_2xx"
    static_configs:
      - targets:
          - "http://web/produtos"
          - "http://web/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "sonda:9115"

  - job_name: "blackbox_dns"
    metrics_path: "/probe"
    params:
      module:
        - "dns_cafeplanalto"
    static_configs:
      - targets:
          - "dns:53"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "sonda:9115"

  - job_name: "blackbox_icmp"
    metrics_path: "/probe"
    params:
      module:
        - "icmp"
    static_configs:
      - targets:
          - "web"
          - "api"
          - "db"
          - "dns"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "sonda:9115"
