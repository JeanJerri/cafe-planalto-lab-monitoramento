global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "172.20.99.21:9093"

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

# Regra de Ouro: todas as coletas usam exclusivamente a rede de dados (172.20.x.x / 10.0.0.x),
# nunca a rede fora de banda eth0 (172.30.0.0/24).
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "172.20.10.21:8000"

  - job_name: "nginx_exporter"
    static_configs:
      - targets:
          - "172.20.10.20:9113"

  - job_name: "postgres_exporter"
    static_configs:
      - targets:
          - "172.20.10.22:9187"

  # Na integracao Containerlab (Fase 4), os exporters de infra ficam na LAN Gerencia (172.20.99.24-25)
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "172.20.99.24:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "172.20.99.25:8080"

  - job_name: "blackbox_exporter"
    static_configs:
      - targets:
          - "172.20.20.30:9115"

  - job_name: "blackbox_http"
    metrics_path: "/probe"
    params:
      module:
        - "http_2xx"
    static_configs:
      - targets:
          - "http://loja.cafeplanalto.lab/produtos"
          - "http://loja.cafeplanalto.lab/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "172.20.20.30:9115"

  - job_name: "blackbox_dns"
    metrics_path: "/probe"
    params:
      module:
        - "dns_cafeplanalto"
    static_configs:
      - targets:
          - "172.20.10.10:53"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "172.20.20.30:9115"

  - job_name: "blackbox_icmp"
    metrics_path: "/probe"
    params:
      module:
        - "icmp"
    static_configs:
      - targets:
          - "10.0.0.1"
          - "10.0.0.2"
          - "172.20.10.20"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "172.20.20.30:9115"
