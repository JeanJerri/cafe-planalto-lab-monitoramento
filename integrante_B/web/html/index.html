<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Café Planalto</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2eb;
      --card: #ffffff;
      --text: #2c1e16;
      --muted: #6c584c;
      --accent: #6f4e37;
      --accent-hover: #563b28;
      --ok: #1b6b3a;
      --err: #a4161a;
      --border: #e0d6c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 0.2rem 0 0; font-size: 0.9rem; color: #e2d5c8; }
    .badge {
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #44332a;
      color: #fff;
    }
    .badge.ok { background: var(--ok); }
    .badge.err { background: var(--err); }
    main {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    .feedback {
      display: none;
      padding: 0.9rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .feedback.ok { display: block; border-color: var(--ok); color: var(--ok); }
    .feedback.err { display: block; border-color: var(--err); color: var(--err); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .card h2 { margin: 0; font-size: 1.05rem; }
    .meta { font-size: 0.85rem; color: var(--muted); }
    .price { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Café Planalto — Loja Virtual</h1>
      <p>Torrefação de cafés especiais · Vitória da Conquista - BA</p>
    </div>
    <div id="health-badge" class="badge">Verificando saúde...</div>
  </header>

  <main>
    <div id="feedback" class="feedback" role="status"></div>
    <section id="catalogo" class="grid">
      <p>Carregando catálogo de cafés...</p>
    </section>
  </main>

  <script>
    const healthBadge = document.getElementById("health-badge");
    const feedbackBox = document.getElementById("feedback");
    const catalogoEl = document.getElementById("catalogo");

    function showFeedback(message, isError) {
      feedbackBox.textContent = message;
      feedbackBox.className = "feedback " + (isError ? "err" : "ok");
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        if (res.ok) {
          healthBadge.textContent = "Saúde: " + data.status + " (" + data.database + ")";
          healthBadge.className = "badge ok";
        } else {
          healthBadge.textContent = "Saúde: " + (data.status || "erro") + " (" + (data.database || "indisponível") + ")";
          healthBadge.className = "badge err";
        }
      } catch (err) {
        healthBadge.textContent = "Saúde: erro de conexão";
        healthBadge.className = "badge err";
      }
    }

    async function comprar(produtoId, btn) {
      btn.disabled = true;
      try {
        const res = await fetch("/pedidos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ produto_id: produtoId, quantidade: 1, cliente: "loja-web" })
        });
        const data = await res.json();
        if (!res.ok) {
          showFeedback("Falha ao criar pedido (HTTP " + res.status + "): " + (data.detail || "erro"), true);
          return;
        }
        showFeedback(
          "Pedido #" + data.id + " confirmado: " + data.produto_nome +
          " — R$ " + Number(data.valor_total_reais).toFixed(2) + " (" + data.status + ")",
          false
        );
      } catch (err) {
        showFeedback("Erro de rede ao enviar pedido: " + err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadProdutos() {
      try {
        const res = await fetch("/produtos");
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const produtos = await res.json();
        catalogoEl.innerHTML = "";
        for (const p of produtos) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div>
              <h2>${p.nome}</h2>
              <p class="meta">${p.origem} · Torra ${p.torra}</p>
              <p>${p.descricao}</p>
            </div>
            <div>
              <p class="price">R$ ${Number(p.preco_reais).toFixed(2)}</p>
              <button type="button">Comprar 1 unidade</button>
            </div>
          `;
          const btn = card.querySelector("button");
          btn.addEventListener("click", () => comprar(p.id, btn));
          catalogoEl.appendChild(card);
        }
      } catch (err) {
        catalogoEl.innerHTML = "<p>Não foi possível carregar o catálogo (" + err.message + ").</p>";
      }
    }

    checkHealth();
    loadProdutos();
  </script>
</body>
</html>
