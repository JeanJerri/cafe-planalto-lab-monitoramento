
services:

  postgres-server:
    image: postgres:17-alpine
    container_name: cafeplanalto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no .env}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      zabbix-gerencia:
        ipv4_address: 172.20.99.12

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-8.0-latest
    container_name: cafeplanalto-zabbix-server
    restart: unless-stopped
    init: true

    environment:
      DB_SERVER_HOST: 172.20.99.12
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no .env}"

    depends_on:
      postgres-server:
        condition: service_healthy

    networks:
      zabbix-gerencia:
        ipv4_address: 172.20.99.10

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-8.0-latest
    container_name: cafeplanalto-zabbix-web
    restart: unless-stopped

    environment:
      DB_SERVER_HOST: 172.20.99.12
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no .env}"

      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_SERVER_PORT: "10051"

      ZBX_SERVER_NAME: "Cafe Planalto - Monitoramento"
      PHP_TZ: America/Bahia

    depends_on:
      postgres-server:
        condition: service_healthy
      zabbix-server:
        condition: service_started

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      zabbix-gerencia:
        ipv4_address: 172.20.99.11
      zabbix-acesso:

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
    name: cafeplanalto-zabbix-postgres-data

networks:
  zabbix-gerencia:
    external: true
    name: zabbix-gerencia

  zabbix-acesso:
    external: true
    name: zabbix-acesso
